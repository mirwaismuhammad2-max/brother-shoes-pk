name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "package.json"
      - "capacitor.config.json"
      - "native/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files (with Firebase SDK bundled inside the app)
        run: |
          mkdir -p www
          cp index.html logo.png icon-192.png icon-512.png intro.mp4 manifest.json www/
          for f in app auth firestore; do
            curl -fsSL -o "www/firebase-$f-compat.js" "https://www.gstatic.com/firebasejs/10.12.2/firebase-$f-compat.js"
          done
          ls -la www

      - name: Install Capacitor
        run: npm install

      - name: Add native Google Drive sign-in plugin
        run: |
          D=native/gdrive
          mkdir -p $D/android/src/main/java/com/brothershoes/gdrive
          cat > $D/package.json <<'EOF'
          {
            "name": "capacitor-gdrive",
            "version": "1.0.0",
            "description": "Native Google Drive access token for Brother Shoes",
            "capacitor": { "android": { "src": "android" } },
            "peerDependencies": { "@capacitor/core": ">=6.0.0" }
          }
          EOF
          cat > $D/android/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"></manifest>
          EOF
          cat > $D/android/build.gradle <<'EOF'
          apply plugin: 'com.android.library'

          android {
              namespace "com.brothershoes.gdrive"
              compileSdk project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 34
              defaultConfig {
                  minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 22
                  targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          repositories {
              google()
              mavenCentral()
          }

          dependencies {
              implementation project(':capacitor-android')
              implementation 'com.google.android.gms:play-services-auth:21.2.0'
          }
          EOF
          cat > $D/android/src/main/java/com/brothershoes/gdrive/GDrivePlugin.java <<'EOF'
          package com.brothershoes.gdrive;

          import android.app.Activity;
          import android.content.Intent;
          import android.content.IntentSender;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.google.android.gms.auth.api.identity.AuthorizationRequest;
          import com.google.android.gms.auth.api.identity.AuthorizationResult;
          import com.google.android.gms.auth.api.identity.Identity;
          import com.google.android.gms.common.api.ApiException;
          import com.google.android.gms.common.api.Scope;
          import java.util.Collections;

          @CapacitorPlugin(name = "GDrive", requestCodes = {9301})
          public class GDrivePlugin extends Plugin {
              private static final int REQ = 9301;

              @PluginMethod
              public void getToken(final PluginCall call) {
                  final boolean interactive = call.getBoolean("interactive", true);
                  AuthorizationRequest request = AuthorizationRequest.builder()
                      .setRequestedScopes(Collections.singletonList(new Scope("https://www.googleapis.com/auth/drive.file")))
                      .build();
                  Identity.getAuthorizationClient(getActivity()).authorize(request)
                      .addOnSuccessListener(result -> {
                          if (result.hasResolution()) {
                              if (!interactive) {
                                  call.reject("Google permission needed. Tap Connect.");
                                  return;
                              }
                              try {
                                  saveCall(call);
                                  getActivity().startIntentSenderForResult(result.getPendingIntent().getIntentSender(), REQ, null, 0, 0, 0, null);
                              } catch (IntentSender.SendIntentException e) {
                                  call.reject("Could not open Google permission screen: " + e.getMessage());
                              }
                          } else {
                              finish(call, result);
                          }
                      })
                      .addOnFailureListener(e -> call.reject("Google sign-in failed: " + e.getMessage()));
              }

              @Override
              protected void handleOnActivityResult(int requestCode, int resultCode, Intent data) {
                  super.handleOnActivityResult(requestCode, resultCode, data);
                  if (requestCode != REQ) return;
                  PluginCall call = getSavedCall();
                  if (call == null) return;
                  if (resultCode != Activity.RESULT_OK) {
                      call.reject("Google permission was cancelled");
                  } else {
                      try {
                          AuthorizationResult r = Identity.getAuthorizationClient(getActivity()).getAuthorizationResultFromIntent(data);
                          finish(call, r);
                      } catch (ApiException e) {
                          call.reject("Google sign-in failed: " + e.getMessage());
                      }
                  }
                  freeSavedCall();
              }

              private void finish(PluginCall call, AuthorizationResult r) {
                  String token = r.getAccessToken();
                  if (token == null) {
                      call.reject("Google did not return an access token");
                      return;
                  }
                  JSObject o = new JSObject();
                  o.put("accessToken", token);
                  call.resolve(o);
              }
          }
          EOF
          npm install ./native/gdrive
          ls -R native/gdrive

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Add native barcode scanner
        run: |
          if [ ! -d native/plugins ]; then
            echo "native/plugins folder not found, skipping native scanner"
            exit 0
          fi
          APPID=$(node -p "require('./capacitor.config.json').appId")
          DIR="android/app/src/main/java/$(echo "$APPID" | tr . /)"
          mkdir -p "$DIR/plugins"
          rm -f "$DIR/MainActivity.java"
          sed "s/com\.brothershoes\.app/$APPID/g" native/plugins/MainActivity.kt > "$DIR/MainActivity.kt"
          sed "s/com\.brothershoes\.app/$APPID/g" native/plugins/BarcodeScanPlugin.kt > "$DIR/plugins/BarcodeScanPlugin.kt"
          sed -i "s/.*com.android.tools.build:gradle.*/&\n        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24'/" android/build.gradle
          sed -i "s/^apply plugin: 'com.android.application'/&\napply plugin: 'kotlin-android'/" android/app/build.gradle
          sed -i "s/^android {/android {\n    kotlinOptions { jvmTarget = '17' }/" android/app/build.gradle
          sed -i "s/^dependencies {/dependencies {\n    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'/" android/app/build.gradle
          echo "--- app id: $APPID"
          ls -R "$DIR"

      - name: Allow camera
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' "$M"
          cat "$M"
          grep -q "android.permission.CAMERA" "$M" || { echo "CAMERA permission missing"; exit 1; }

      - name: Set app icon
        run: |
          cd android/app/src/main/res
          rm -rf mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "mipmap-$d"
            cp "$GITHUB_WORKSPACE/icon-512.png" "mipmap-$d/ic_launcher.png"
            cp "$GITHUB_WORKSPACE/icon-512.png" "mipmap-$d/ic_launcher_round.png"
            cp "$GITHUB_WORKSPACE/icon-512.png" "mipmap-$d/ic_launcher_foreground.png"
          done

      - name: Use permanent signing key (keeps Google sign-in working)
        run: |
          echo '' | base64 -d > android/app/brothershoes.keystore
          python3 - <<'PY'
          import re
          p = 'android/app/build.gradle'
          s = open(p).read()
          snip = """android {
              signingConfigs {
                  debug {
                      storeFile file("brothershoes.keystore")
                      storePassword "brothershoes"
                      keyAlias "brothershoes"
                      keyPassword "brothershoes"
                  }
              }"""
          assert re.search(r'^android \{', s, re.M), 'android block not found'
          s = re.sub(r'^android \{', lambda m: snip, s, count=1, flags=re.M)
          open(p, 'w').write(s)
          PY
          echo "--- App signing SHA-1 (put this in Google Cloud, Android client):"
          keytool -list -v -keystore android/app/brothershoes.keystore -storepass brothershoes | grep SHA1

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BrotherShoes-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
