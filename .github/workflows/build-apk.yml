name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "package.json"
      - "capacitor.config.json"
      - "native/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files (with Firebase SDK bundled inside the app)
        run: |
          mkdir -p www
          cp index.html logo.png icon-192.png icon-512.png intro.mp4 manifest.json www/
          for f in app auth firestore; do
            curl -fsSL -o "www/firebase-$f-compat.js" "https://www.gstatic.com/firebasejs/10.12.2/firebase-$f-compat.js"
          done
          ls -la www

      - name: Install Capacitor
        run: npm install

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Add native barcode scanner
        run: |
          if [ ! -d native/plugins ]; then
            echo "native/plugins folder not found, skipping native scanner"
            exit 0
          fi
          APPID=$(node -p "require('./capacitor.config.json').appId")
          DIR="android/app/src/main/java/$(echo "$APPID" | tr . /)"
          mkdir -p "$DIR/plugins"
          rm -f "$DIR/MainActivity.java"
          sed "s/com\.brothershoes\.app/$APPID/g" native/plugins/MainActivity.kt > "$DIR/MainActivity.kt"
          sed "s/com\.brothershoes\.app/$APPID/g" native/plugins/BarcodeScanPlugin.kt > "$DIR/plugins/BarcodeScanPlugin.kt"
          sed -i "s/.*com.android.tools.build:gradle.*/&\n        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24'/" android/build.gradle
          sed -i "s/^apply plugin: 'com.android.application'/&\napply plugin: 'kotlin-android'/" android/app/build.gradle
          sed -i "s/^android {/android {\n    kotlinOptions { jvmTarget = '17' }/" android/app/build.gradle
          sed -i "s/^dependencies {/dependencies {\n    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'/" android/app/build.gradle
          echo "--- app id: $APPID"
          ls -R "$DIR"

      - name: Set app icon
        run: |
          cd android/app/src/main/res
          rm -rf mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "mipmap-$d"
            cp "$GITHUB_WORKSPACE/icon-512.png" "mipmap-$d/ic_launcher.png"
            cp "$GITHUB_WORKSPACE/icon-512.png" "mipmap-$d/ic_launcher_round.png"
            cp "$GITHUB_WORKSPACE/icon-512.png" "mipmap-$d/ic_launcher_foreground.png"
          done

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BrotherShoes-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
